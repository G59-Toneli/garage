name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: garage
          POSTGRES_PASSWORD: garage
          POSTGRES_DB: garage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garage -d garage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GARAGE_DATABASE_URL: postgresql://garage:garage@localhost:5432/garage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # The baseline embedder's weights: 470 MB, pinned by sha256 in `garage/embedding.py`, verified
      # by the same code that later loads them. Cached on that digest, so it is one download for the
      # life of the pin and a cache hit on every run after — and a changed pin is a changed key,
      # which is a fresh download rather than a stale model nobody notices.
      #
      # This is the only network access the pipeline has beyond installing packages. `pytest`,
      # `ingest` and `eval gate` are offline after it: no API key, no provider, no inference service.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/garage/embedders
          key: embedder-ca456c06b3a9505ddfd9131408916dd79290368331e7d76bb621f1cba6bc8665
      - run: python -m garage embedder fetch
      # Note that no step creates a Postgres extension. `pg_trgm` and `vector` are both created by
      # `ingest`, so the hand-copied `psql` line that used to live here — a duplicate of
      # `docker/initdb/001-extensions.sql`, which GitHub service containers cannot mount — is gone
      # along with the file. One statement, in the step that always runs.
      - run: pytest
      # The corpus hash must be a property of the Corpus, not of the machine that computed it. The
      # digest is pinned in tests/test_corpus.py, so `pytest` above already made the cross-machine
      # comparison — this step proves the same guarantee holds through the CLI operators actually run.
      - run: python -m garage corpus validate
      # The build step operators actually run. `pytest` already ingested through the library; this
      # proves the command does it too, against a database it did not create itself.
      - run: python -m garage ingest
      # Retrieval quality as a build gate. Needs no API key and no network — the questions, the
      # expected answers, the baseline and the thresholds are all committed, so this step is a pure
      # function of the checkout and the artifact `ingest` just built (ADR-0004). It runs last
      # because it is the only step that needs a populated database it did not populate itself.
      #
      # It also re-measures the newest run record in `eval/runs/` and fails if the two disagree.
      # Records are generated locally and committed with the change that moved them, which makes
      # each one a reproducible assertion rather than a by-product of whichever CI machine ran
      # (ADR-0002). Nothing here ever writes to the repository: promotion is a human commit.
      - run: python -m garage eval gate

  image:
    # The deployment target is an ARM VM (ADR-0001), so arm64 builds on every change and not at
    # deploy time. Since issue #11 it is also *pushed* — but only from `main`, so a branch still gets
    # the build as a gate without publishing an image nobody asked for.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The only new permission, and no new secret: `GITHUB_TOKEN` already exists and GHCR accepts
      # it. A deploy that needed a personal access token would be a deploy nobody else could
      # reproduce, which is the same objection ADR-0009 makes to the tunnel.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # GHCR rejects an uppercase path and `github.repository` is `G59-Toneli/garage`. Lowercased
      # here rather than hard-coded, so a rename or a fork still pushes to the right place.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          # Tagged by sha *and* by `main`, and the deployment pins neither. `deploy/compose.prod.yaml`
          # names a `@sha256:` digest, because a tag is a mutable pointer and "what is running in
          # production" has to be a question the git history answers. The tags exist so a human can
          # find the image; the digest is what runs.
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          # Baked into the image, and it is a cache-key component before it is a display string:
          # without it a deploy that changes the prompt keeps serving the previous build's cached
          # answers under this build's version stamp (`garage/cache.py`).
          build-args: |
            GARAGE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The digest a human copies into `deploy/compose.prod.yaml`. Printed rather than committed by
      # a bot: the deploy is a commit somebody makes on purpose (ADR-0001), and a workflow that
      # updated production on every merge to `main` would be continuous deployment nobody chose.
      - if: github.ref == 'refs/heads/main'
        run: |
          echo "::notice title=Deploy digest::${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}"
