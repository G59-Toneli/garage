      - paragraph [ref=f24e40]: "A mesma pergunta que \"cylinder head bolt stage 2 torque\", escrita como um mecânico escreveria, e o resultado é desconfortável: nesta pergunta o lexical não recupera nada e o denso recupera dez trechos, todos Tier B, de fórum e de blog — nenhuma das duas colunas responde. Isto é o que acontece nesta pergunta, e não uma afirmação sobre o corpus: medido sobre as 21 perguntas naturais em português da suíte, o lexical recupera algo em 2 delas e o denso traz algum Tier A em 4. O número que resume a dívida é outro — recall português → Tier A sob denso = 2/10 = 0,20, e o cruzamento genuíno de idioma responde por 6,5% do ganho do denso em recall@10:natural (análise completa e correção pública na issue #7). O Tier A deste Corpus é escrito em inglês. A pergunta está no showcase porque uma vitrine que só mostrasse os acertos seria propaganda."
