services:
  postgres:
    # pgvector ships prebuilt for arm64, which the Oracle Ampere target requires (ADR-0001).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage}
      POSTGRES_DB: ${POSTGRES_DB:-garage}
    ports:
      - "5432:5432"
    # No `docker-entrypoint-initdb.d` mount any more. It ran `CREATE EXTENSION vector` exactly once,
    # when the data directory was empty, which meant a developer with an older volume had a database
    # the server could not query and no way to notice until a query failed. Both extensions are now
    # created by `python -m garage ingest`, the one step that already owns DDL and is always re-run
    # (see `database.CREATE_EXTENSIONS`).
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garage} -d ${POSTGRES_DB:-garage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  serve:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      GARAGE_DATABASE_URL: ${GARAGE_DATABASE_URL:-postgresql://${POSTGRES_USER:-garage}:${POSTGRES_PASSWORD:-garage}@postgres:5432/${POSTGRES_DB:-garage}}
    ports:
      - "${GARAGE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
