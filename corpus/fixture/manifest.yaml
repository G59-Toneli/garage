# Fixture Corpus — five invented documents standing in for the real material.
#
# Nothing here is a real publication. The documents were written for this repository so that the
# whole pipeline can be built, tested and measured before any real manual has been acquired, and so
# that tests never depend on copyrighted material or on which PDFs happen to be on someone's disk
# (ADR-0003). The fixture is permanent, not throwaway.
#
# The format is documented in docs/corpus-manifest.md. A real Corpus uses the same format; the only
# difference is that its `sources` directory lives on the operator's own disk rather than in git.

