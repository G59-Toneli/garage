[project]
name = "garage"
version = "0.1.0"
description = "A reproducible retrieval benchmark over a corpus about a 1993 Chevrolet Kadett GSi"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
