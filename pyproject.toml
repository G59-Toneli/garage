[project]
name = "garage"
version = "0.1.0"
description = "A reproducible retrieval benchmark over a corpus about a 1993 Chevrolet Kadett GSi"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    # The baseline embedder, and deliberately *not* torch or sentence-transformers (ADR-0008).
    # These two are the whole inference stack: `onnxruntime` runs the graph, `tokenizers` is the
    # Rust SentencePiece implementation the e5 family needs, and both ship prebuilt arm64 wheels
    # for the Oracle Ampere target (ADR-0001) where the torch stack narrows sharply. `numpy` is
    # already a hard dependency of `onnxruntime` and is named here because `embedding.py` imports
    # it directly — an inherited dependency used on purpose is a declared one.
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]
# Optional on purpose. Generation is the layer the service is complete without, and the whole test
# suite runs with neither this package nor an API key present — no test may import `google.genai`.
gemini = ["google-genai>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `pytest` must never reach a paid API or an optional dependency by accident. Skipping on the
# absence of a key is not a gate — it makes the default behaviour of the suite depend on whether the
# developer happened to export the variable this project's own documentation tells them to export.
# Running a live test is an act: `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: touches a real provider or the optional `gemini` extra; excluded from the default run",
]
